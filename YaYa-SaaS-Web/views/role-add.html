<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../layui/css/layui.css">
    <link rel="stylesheet" href="../css/yaya-common.css">
    <link rel="stylesheet" href="../css/yaya-style-extend.css">
    <!-- 第三方图标库css -->
    <link rel="stylesheet" href="../font/iconfont.css">
    <title>yaya-admin-plus</title>
    <style>
        .layui-form-radio:hover>*, .layui-form-radioed, .layui-form-radioed>i{
            color: #409eff;
        }
        .layui-input:focus {
            border-color: #1476ff!important;
            box-shadow: 0 0 0 3px rgba(22,183,119,.08)
        }
        .icon-item {
            display: inline-block;
            padding: 8px;
            cursor: pointer;
            font-size: 20px;
            width: 40px;
            text-align: center;
        }
        .icon-item:hover {
            background-color: #f0f0f0;
            border-radius: 4px;
        }
        .layui-form-label{
            width: unset;
        }
        .layui-input-block{
            margin-left: 70px;
        }
        xm-select{
            border-radius: 5px !important;
        }
    </style>
</head>
<body>
    <div class="yaya-container">
        <div class="yaya-panel">
            <div class="layui-fluid">
            <form class="layui-form" style="margin-top: 10px;">
                <div class="layui-form-item">
                    <label class="layui-form-label">名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="roleName" lay-verify="required" placeholder="请输入角色名" autocomplete="off" lay-reqtext="请输入角色名" lay-affix="clear" class="layui-input yaya-input-border-radius">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">编号</label>
                    <div class="layui-input-block">
                        <input type="text" name="roleCode" lay-verify="required" placeholder="请输入角色编号" lay-reqtext="请输入角色编号" lay-affix="clear" autocomplete="off" class="layui-input yaya-input-border-radius">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">类型</label>
                    <div class="layui-input-block">
                        <input type="radio" name="roleType" value="0" title="普通" checked>
                        <input type="radio" name="roleType" value="1" title="管理">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">租户</label>
                    <div class="layui-input-block">
                        <select name="deptId" lay-verify="required">
                            <!-- 租户列表 -->
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="正常" checked>
                        <input type="radio" name="status" value="0" title="禁用">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">权限</label>
                    <div class="layui-input-block">
                        <select name="dataScope" id="dataScope" lay-filter="data-scope-filter">
                            <!-- 数据权限 -->
                        </select>
                    </div>
                </div>
                <div class="layui-form-item" id="dept" style="display: none;">
                    <label class="layui-form-label">部门</label>
                    <div class="layui-input-block">
                        <!-- 部门列表 -->
                        <div id="deptId"></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <button type="button" class="yaya-btn yaya-primary" style="width: 100%;" lay-submit lay-filter="add">添加</button>
                </div>
            </form>
        </div>
        </div>
    </div>
    <script src="../layui/layui.js"></script>
    <script src="../js/xm-select.js"></script>
    <script src="../js/server.js"></script>
    <script>
        layui.use(function(){
            const $ = layui.$;
            const form = layui.form;
            const layer = layui.layer;

            //提交角色
            form.on('submit(add)', function(data){
                let field = data.field; // 获取表单字段值
                //参数json化
                let params = JSON.stringify(field);
                //AJAX请求
                $.ajax({
                    type:'post',
                    url: server_url+'/addSysRole',
                    headers:{
                        'Authorization': token
                    },
                    contentType:'application/json',
                    data:params,
                    dataType:'json',
                    success:function(response){
                        if(response.code===0){
                            //关闭弹窗
                            let index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
                            parent.layer.close(index); // 再执行关闭
                        }else{
                            layer.msg(response.msg);
                        }
                    }
                });
                return false; // 阻止默认 form 跳转
            });

            //权限列表
            $.ajax({
                type:'POST',
                url: server_url+'/getSysRoleDataScope',
                headers:{
                    'Authorization': token
                },
                contentType:'application/json',
                dataType:'json',
                success:function(response){
                    if(response.code===0){
                        let list = response.data;
                        if(list && list.length>0){
                            let str='<option value="">请选择</option>';
                            for(let i=0;i<list.length;i++){
                                str+=`<option value="${list[i].data_id}">${list[i].data_scope}</option>`;
                            }
                            //设置到指定位置
                            $("#dataScope").html(str);
                            //刷新
                            form.render('select');
                            //绑定事件
                            form.on('select(data-scope-filter)', function(data){
                                const value = data.value;
                                if(value && value==5){
                                    //显示
                                    $("#dept")[0].style='display: block;';
                                }else{
                                    $("#dept")[0].style='display: none;';
                                }
                            });
                        }
                    }else{
                        layer.msg(response.msg);
                    }
                }
            });


            //租户列表(使用顶层部门模拟)
            $.ajax({
                type:'POST',
                url: server_url+'/getOneLevelSysDepartment',
                headers:{
                    'Authorization': token
                },
                contentType:'application/json',
                dataType:'json',
                success:function(response){
                    if(response.code===0){
                        let list = response.data;
                        let str='';
                        if(list && list.length>0){
                            for (let index = 0; index < list.length; index++) {
                                str+=`
                                    <option value="${list[index].deptId}">${list[index].deptName}</option>
                                `;
                            }
                        }
                        //设置到指定位置
                        $('select[name="deptId"]').html(str);
                        //重新渲染
                        form.render("select");
                    }else{
                        layer.msg(response.msg);
                    }
                }
            });

            

            //部门列表
            $.ajax({
                type:'POST',
                url: server_url+'/getSysDepartmentTree',
                headers:{
                    'Authorization': token
                },
                contentType:'application/json',
                dataType:'json',
                success:function(response){
                    if(response.code===0){
                        let list = response.data;
                        if(list && list.length>0){
                            var dept = xmSelect.render({
                                el: '#deptId', 
                                data: list,
                                height:'100px',
                                name:'deptIds',
                                theme: {
                                    color: '#409eff',
                                },
                                prop: {
                                    name: 'deptName',
                                    value: 'deptId',
                                },
                                tree:{
                                    //是否显示树状结构
                                    show: true,
                                    //是否展示三角图标
                                    showFolderIcon: true,
                                    //是否显示虚线
                                    showLine: false,
                                    //间距
                                    indent: 20,
                                    //是否严格遵守父子模式，false：选中父即只有父被选中,选中子只有子被选中
	                                strict: false,
                                    //默认展开节点
	                                expandedKeys: [-1, -3]
                                }
                            })
                        }
                    }else{
                        layer.msg(response.msg);
                    }
                }
            });

        });
    </script>
</body>
</html>
