<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../layui/css/layui.css">
    <title>公告详情</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .notice-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        /* 标题包装器 */
        .title-container {
            display: flex;
            align-items: flex-start; 
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        /* 长标题截断 */
        .notice-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            flex: 1;                 
            white-space: nowrap;     
            overflow: hidden;        
            text-overflow: ellipsis; 
        }

        /* 标签容器 */
        .badge-group {
            display: flex;
            gap: 8px;
            flex-shrink: 0;          
            margin-top: 6px;         
        }

        /* 标签基础样式 */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            white-space: nowrap;     
        }
        
        /* 1. 置顶状态标签样式 */
        .is-top-true {
            background-color: #ef4444;
            color: white;
        }
        .is-top-false {
            background-color: #f3f4f6;
            color: #9ca3af;
            border: 1px solid #e5e7eb;
        }
        
        /* 2. 类型标签 */
        .badge-type {
            background-color: #eff6ff;
            color: var(--primary-color);
            border: 1px solid #bfdbfe;
        }

        /* 3. 级别标签 */
        .badge-level {
            border: 1px solid transparent;
        }
        .level-1 {
            background-color: #f0fdf4;
            color: #16a34a;
            border-color: #bbf7d0;
        }
        .level-2 {
            background-color: #fffbeb;
            color: #d97706;
            border-color: #fde68a;
        }
        .level-3 {
            background-color: #fef2f2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        /* 元数据 */
        .notice-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* 富文本区域 */
        .notice-body {
            font-size: 16px;
            color: #374151;
            min-height: 300px;
        }
        .notice-body img {
            max-width: 100% !important;
            height: auto !important;
            display: block;
            margin: 15px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="notice-header">
        <div class="title-container">
            <h1 class="notice-title" id="noticeTitle" title="">加载中...</h1>
            
            <div class="badge-group">
                <span class="badge" id="topBadge">-</span>
                <span class="badge badge-level" id="levelBadge" style="display: none;">-</span>
                <span class="badge badge-type" id="typeName">-</span>
            </div>
        </div>
        
        <div class="notice-meta">
            <div>发布部门：<span id="deptName" style="font-weight: 500;">-</span></div>
            <div>发布时间：<span id="createTime">-</span></div>
        </div>
    </header>

    <article class="notice-body" id="noticeContent"></article>
</div>
<script src="../layui/layui.js"></script>
<script src="../js/server.js"></script>
<script>
    layui.use(function(){
        const $ = layui.$;
        const layer = layui.layer;

        //地址
        let url = layui.url();
        //参数
        let search = url.search;
        //消息iD
        let noticeId = search.noticeId;

        //获取消息详情
        $.ajax({
            type:'POST',
            url: server_url+'/getSysNoticeById',
            headers:{
                'Authorization': token
            },
            data:{noticeId:noticeId},
            dataType:'json',
            success:function(response){
                if(response.code===0){
                    renderNoticeDetail(response);
                }else{
                    layer.msg(response.msg);
                }
            }
        });

       

        function renderNoticeDetail(res) {
        if (res.code !== 0 || !res.data) return;
        const detail = res.data;

        // 1. 标题
        const titleEl = document.getElementById('noticeTitle');
        titleEl.innerText = detail.noticeTitle;
        titleEl.setAttribute('title', detail.noticeTitle); 

        // 2. 元数据
        document.getElementById('createTime').innerText = detail.createTime;
        document.getElementById('deptName').innerText = detail.sysDepartment?.deptName || '未知部门';
        document.getElementById('typeName').innerText = detail.sysNoticeType?.noticeTypeName || '公告';

        // 3. 核心修改：明确判断并渲染“是否置顶”的标记
        const topBadge = document.getElementById('topBadge');
        if (detail.isTop === 1) {
            topBadge.innerText = '已置顶';
            topBadge.className = 'badge is-top-true'; // 红色高亮样式
        } else {
            topBadge.innerText = '常规';
            topBadge.className = 'badge is-top-false'; // 灰色低调样式
            // 如果你希望不置顶时完全不显示，可以把上面两行删掉，换成下面这行：
            // topBadge.style.display = 'none';
        }

        // 4. 公告级别
        const levelBadge = document.getElementById('levelBadge');
        if (detail.noticeLevel !== undefined && detail.noticeLevel !== null) {
            levelBadge.style.display = 'inline-flex';
            switch(detail.noticeLevel) {
                case 0:
                    levelBadge.innerText = '普通级别';
                    levelBadge.classList.add('level-1');
                    break;
                case 1:
                    levelBadge.innerText = '重要级别';
                    levelBadge.classList.add('level-2');
                    break;
                case 2:
                    levelBadge.innerText = '紧急级别';
                    levelBadge.classList.add('level-3');
                    break;
            }
        }

        // 5. 内容
        document.getElementById('noticeContent').innerHTML = detail.noticeContent;
    }
    });
</script>
</body>
</html>
