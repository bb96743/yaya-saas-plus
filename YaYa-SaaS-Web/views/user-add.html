<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../layui/css/layui.css">
    <link rel="stylesheet" href="../css/yaya-common.css">
    <link rel="stylesheet" href="../css/yaya-style-extend.css">
    <!-- 第三方图标库css -->
    <link rel="stylesheet" href="../font/iconfont.css">
    <title>yaya-admin-plus</title>
    <style>
        /* 分页页码显示 伪类 */
        .layui-laypage a:hover{
            color: #409eff;
        }
        /* 下拉框圆角 */
        .layui-form-select .layui-input{
            border-radius: 5px;
        }
        /* 弹出层圆角 */
        .layui-layer{
            border-radius: 10px;
        }
        /* 单选框颜色 */
        .layui-form-radio:hover>*, .layui-form-radioed, .layui-form-radioed>i{
            color: #409eff;
        }
        .layui-form-label{
            width: unset;
        }
        .layui-input-block{
            margin-left: 70px;
        }
        xm-select{
            border-radius: 5px !important;
        }
    </style>
</head>
<body>
    <div class="yaya-container">
        <div class="yaya-panel">
            <div class="layui-fluid">
                <form class="layui-form" style="margin-top: 10px;">
                    <div class="layui-form-item">
                        <label class="layui-form-label">名称</label>
                        <div class="layui-input-block">
                            <input type="text" name="nickname" lay-verify="required" placeholder="请输入用户名称" autocomplete="off" lay-reqtext="请输入用户名称" lay-affix="clear" class="layui-input yaya-input-border-radius">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">账号</label>
                        <div class="layui-input-block">
                            <input type="text" name="username" lay-verify="required" placeholder="请输入账号" lay-reqtext="请输入账号" lay-affix="clear" autocomplete="off" class="layui-input yaya-input-border-radius">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">密码</label>
                        <div class="layui-input-block">
                            <input type="password" name="password" lay-verify="required" placeholder="请输入账号" lay-reqtext="请输入账号" lay-affix="eye" autocomplete="off" class="layui-input yaya-input-border-radius">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">性别</label>
                        <div class="layui-input-block">
                            <input type="radio" name="sex" value="1" title="男" checked>
                            <input type="radio" name="sex" value="0" title="女">
                            <input type="radio" name="sex" value="2" title="秘密">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">部门</label>
                        <div class="layui-input-block">
                            <!-- 部门列表 -->
                            <div id="deptId"></div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">岗位</label>
                        <div class="layui-input-block">
                            <!-- 岗位列表 -->
                            <div id="postId"></div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">角色</label>
                        <div class="layui-input-block">
                            <!-- 角色列表 -->
                            <div id="roleId"></div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">时间</label>
                        <div class="layui-input-block">
                            <input type="text" name="expiredTime" placeholder="过期时间" class="layui-input yaya-input-border-radius" id="expiredTime">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <button type="button" class="yaya-btn yaya-primary" style="width: 100%;" lay-submit lay-filter="add">添加</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="../layui/layui.js"></script>
    <script src="../js/xm-select.js"></script>
    <script src="../js/server.js"></script>
    <script>
        layui.use(function(){

            const $ = layui.$;
            const form = layui.form;
            const layer = layui.layer;
            const laydate = layui.laydate;

            //过期时间
            laydate.render({
                elem: '#expiredTime',
                type: 'datetime'
            });

            //提交用户
            form.on('submit(add)', function(data){
                //加载图标
                let index = layer.load(0);
                let field = data.field; // 获取表单字段值
                //参数json化
                let params = JSON.stringify(field);
                //AJAX请求
                $.ajax({
                    type:'post',
                    url: server_url+'/addSysUser',
                    headers:{
                        'Authorization': token
                    },
                    contentType:'application/json',
                    data:params,
                    dataType:'json',
                    success:function(response){
                        //关闭加载图标
                        layer.close(index);
                        if(response.code===0){
                            //关闭弹窗
                            let index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
                            parent.layer.close(index); // 再执行关闭
                        }else{
                            layer.msg(response.msg);
                        }
                    }
                });
                return false; // 阻止默认 form 跳转
            });

            //角色列表
            $.ajax({
                type:'POST',
                url: server_url+'/getSysRoleList',
                headers:{
                    'Authorization': token
                },
                contentType:'application/json',
                dataType:'json',
                success:function(response){
                    if(response.code===0){
                        let list = response.data;
                        if(list && list.length>0){
                            //角色多选(用户和角色是多对多关系)
                            xmSelect.render({
                                el: '#roleId',
                                data: list,
                                height:'100px',
                                name:'roleIds',
                                theme: {
                                    color: '#409eff',
                                },
                                prop: {
                                    name: 'roleName',
                                    value: 'roleId',
                                }
                            })
                        }
                    }else{
                        layer.msg(response.msg);
                    }
                }
            });
            
            //岗位列表
            $.ajax({
                type:'POST',
                url: server_url+'/getSysPostList',
                headers:{
                    'Authorization': token
                },
                contentType:'application/json',
                dataType:'json',
                success:function(response){
                    if(response.code===0){
                        let list = response.data;
                        if(list && list.length>0){
                            var post = xmSelect.render({
                                el: '#postId', 
                                data: list,
                                height:'100px',
                                name:'postIds',
                                theme: {
                                    color: '#409eff',
                                },
                                prop: {
                                    name: 'postName',
                                    value: 'postId',
                                }
                            })
                        }
                    }else{
                        layer.msg(response.msg);
                    }
                }
            });


            //部门列表
            $.ajax({
                type:'POST',
                url: server_url+'/getSysDepartmentTree',
                headers:{
                    'Authorization': token
                },
                contentType:'application/json',
                dataType:'json',
                success:function(response){
                    if(response.code===0){
                        let list = response.data;
                        if(list && list.length>0){
                            var dept = xmSelect.render({
                                el: '#deptId', 
                                data: list,
                                max: 1,
                                height:'100px',
                                name:'deptId',
                                theme: {
                                    color: '#409eff',
                                },
                                prop: {
                                    name: 'deptName',
                                    value: 'deptId',
                                },
                                tree:{
                                    //是否显示树状结构
                                    show: true,
                                    //是否展示三角图标
                                    showFolderIcon: true,
                                    //是否显示虚线
                                    showLine: false,
                                    //间距
                                    indent: 20,
                                    //是否严格遵守父子模式，false：选中父即只有父被选中,选中子只有子被选中
                                    strict: false,
                                    //默认展开节点
                                    expandedKeys: [-1, -3]
                                }
                            })
                        }
                    }else{
                        layer.msg(response.msg);
                    }
                }
            });

        });

        
    </script>
</body>
</html>
