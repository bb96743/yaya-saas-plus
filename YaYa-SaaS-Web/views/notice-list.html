<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../layui/css/layui.css">
    <link rel="stylesheet" href="../css/yaya-common.css">
    <link rel="stylesheet" href="../css/yaya-style-extend.css">
    <!-- 第三方图标库css -->
    <link rel="stylesheet" href="../font/iconfont.css">
    <title>yaya-admin-plus</title>
    <style>
        /* 分页页码显示 伪类 */
        .layui-laypage a:hover{
            color: #409eff;
        }
        /* 下拉框圆角 */
        .layui-form-select .layui-input{
            border-radius: 5px;
        }
        .layui-layer{
            border-radius: 10px;
        }
        /* 表格头部样式 */
        .layui-table-tool .layui-table-tool-temp{
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: flex-end;
            padding-right:unset;
        }
    </style>
</head>
<body>
    <div class="yaya-container">
        <div class="yaya-panel">
            <form class="layui-form" style="padding: 10px 0;">
                <div class="layui-row">
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <label class="yaya-form-label">标题</label>
                        <div class="yaya-input-block">
                            <input type="text" name="noticeTitle" placeholder="消息标题" class="layui-input yaya-input-border-radius">
                        </div>
                    </div>
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <button type="button" class="yaya-btn yaya-primary" lay-submit lay-filter="search"><i class="iconfont icon-CRMEB-sousuo-xianxing" style="padding-right: 5px;"></i> 搜索</button>
                        <button type="reset" class="yaya-btn" style="margin-left: 10px;"><i class="iconfont icon-CRMEB-shuaxin1" style="padding-right: 5px;"></i> 重置</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="yaya-panel" style="margin-top: 15px;padding: 5px;">
            <!-- 表格显示 -->
            <table class="layui-hide" id="table-notice" lay-filter="table-notice"></table>
        </div>
    </div>
    <!-- 表格单元格:删除-更新-添加 权限控制 -->
    <script id="ID-notice-unit-tpl" type="text/html">
        {{# if(is_super || hasPermission('notice-detail')){ }}
        <button class="yaya-btn is-link-primary yaya-btn-small" lay-event="detail"><i style="font-size: 12px;margin-right: 2px;" class="iconfont icon-CRMEB-neirongzixun-xianxing"></i> 详情</button>
        {{# } }}
        {{# if(is_super || hasPermission('notice-edit')){ }}
        <button class="yaya-btn is-link-primary yaya-btn-small" lay-event="edit"><i style="font-size: 12px;margin-right: 2px;" class="iconfont icon-CRMEB-tianxie"></i> 编辑</button>
        {{# } }}
        {{# if(is_super || hasPermission('notice-assign')){ }}
        <button class="yaya-btn is-link-primary yaya-btn-small" lay-event="assign"><i style="font-size: 12px;margin-right: 2px;" class="iconfont icon-CRMEB-yonghuyunying-xianxing1"></i> 分配</button>
        {{# } }}
        {{# if(is_super || hasPermission('notice-del')){ }}
        <button class="yaya-btn is-link-primary yaya-btn-small" lay-event="del"><i class="layui-icon layui-icon-delete"></i> 删除</button>
        {{# } }}
    </script>
    <!-- 顶部添加权限控制 -->
    <script id="ID-notice-top-tpl" type="text/html">
        {{# if(is_super || hasPermission('notice-add')){ }}
        <button type="button" lay-event="notice-add" class="yaya-btn is-plain-primary" style="margin-right: 5px;"><i class="iconfont icon-CRMEB-jia"></i>新增</button>
        {{# } }}
    </script>
    <script src="../layui/layui.js"></script>
    <script src="../js/server.js"></script>
    <script>
        layui.use(function(){
            const $ = layui.$;
            const form = layui.form;
            const table = layui.table;
            const layer = layui.layer;
            
            table.on('tool(table-notice)', function(obj){
                console.log(obj);
                //事件
                let event = obj.event;
                if(event==='del'){ //删除事件
                    layer.confirm('确定删除吗？', function(index){
                        layer.close(index);//关闭弹窗
                        // 向后端发送删除请求，执行完毕后，可通过 reloadData 方法完成数据重载
                        let noticeId = obj.data.noticeId;
                        $.ajax({
                            url: server_url+'/deleteSysNotice',
                            type:'POST',
                            dataType:'json',
                            headers:{
                                'Authorization': token
                            },
                            data:{noticeId:noticeId},
                            success: function(resp){
                                if(resp.code===0){
                                    //刷新
                                    table.reload('table-notice');
                                }else{
                                    layer.msg(resp.msg)
                                }
                            }
                        });
                    });
                }else if(event==='edit'){ //编辑事件
                    layer.open({
                        type: 2, // page 层类型 iframe
                        area: ['800px', '550px'],
                        title: '编辑',
                        shade: 0.6, // 遮罩透明度
                        shadeClose: true, // 点击遮罩区域，关闭弹层
                        content: `notice-edit.html?noticeId=${obj.data.noticeId}&noticeTypeId=${obj.data.noticeTypeId}`,
                        end: function(){
                            //刷新表格
                            table.reload('table-notice');
                        }
                    });
                }else if(event==='detail'){ //编辑事件
                    layer.open({
                        type: 2, // page 层类型 iframe
                        offset: '10px',
                        area: ['800px', '550px'],
                        title: '详情',
                        shade: 0.6, // 遮罩透明度
                        shadeClose: true, // 点击遮罩区域，关闭弹层
                        content: `notice-list-detail.html?noticeId=${obj.data.noticeId}`,
                        end: function(){
                            //刷新表格
                            table.reload('table-notice');
                        }
                    });
                }else if(event==='assign'){ //分配事件
                    layer.open({
                        type: 2, // page 层类型 iframe
                        offset: '10px',
                        area: ['450px', '400px'],
                        title: '分配',
                        shade: 0.6, // 遮罩透明度
                        shadeClose: true, // 点击遮罩区域，关闭弹层
                        content: `notice-assign.html?noticeId=${obj.data.noticeId}`,
                        end: function(){
                            //刷新表格
                            table.reload('table-notice');
                        },
                        success: function(layero, index){
                            let body = layer.getChildFrame('body', index);
                            // 给 iframe 页中的某个输入框赋值
                            body.find('input[name="noticeId"]').val(obj.data.noticeId);
                        }
                    });
                }else{
                    layer.msg("功能还在路上,敬请期待~");
                }

            });

            // 头部工具栏事件
            table.on('toolbar(table-notice)', function(obj){
                switch(obj.event){
                    case 'notice-add':
                        layer.open({
                            type: 2, // page 层类型 iframe
                            offset: '10px',
                            area: ['800px', '550px'],
                            title: '添加',
                            shade: 0.6, // 遮罩透明度
                            shadeClose: true, // 点击遮罩区域，关闭弹层
                            content: 'notice-add.html',
                            end: function(){
                                //刷新表格
                                table.reload('table-notice');
                            }
                        });
                    break;
                    default:
                        layer.msg("功能在路上");
                }
            });

            //搜索
            form.on('submit(search)', function(data){
                let field = data.field; // 获得表单字段
                // 执行搜索重载
                table.reload('table-notice', {
                    page: {
                        curr: 1, // 重新从第 1 页开始
                        prev:'上一页',
                        next:'下一页',
                        limit:10,
                        limits:[10,20,30,40,50],
                        theme:'#409eff'
                    },
                    where: field // 搜索的字段
                });
                return false; // 阻止默认 form 跳转
            });

            //表格渲染
            table.render({
                elem: '#table-notice',
                url: server_url+'/getSysNoticePage',
                method:'POST',
                headers:{
                    'Authorization':token
                },
                toolbar:'#ID-notice-top-tpl',
                defaultToolbar:[], //表格头部右侧工具栏,隐藏
                skin:'line',
                height:'full',
                parseData: function(res){
                    return {
                        "code" : res.code,
                        "msg"  : res.msg,
                        "data" : res.data.records,
                        "count": res.data.total
                    }
                },
                page:{
                    prev:'上一页',
                    next:'下一页',
                    limit:10,
                    limits:[10,20,30,40,50],
                    theme:'#409eff'
                },
                request: {
                    pageName: 'pageNo', // 页码的参数名称，默认：page
                    limitName: 'pageSize' // 每页数据条数的参数名，默认：limit
                },
                cols: [[
                    {
                        title: '#',
                        type: 'numbers'
                    },
                    {
                        field:'noticeTitle',
                        title: '标题'
                    },
                    {
                        title: '级别',
                        templet: function(d){
                            let noticeLevel = d.noticeLevel;
                            if(noticeLevel==0){
                                return `<span class="yaya-tag yaya-tag-light-primary tag-small">普通</span>`;
                            }else if(noticeLevel==1){
                                return `<span class="yaya-tag yaya-tag-light-warning tag-small">重要</span>`;
                            }else{
                                return `<span class="yaya-tag yaya-tag-light-danger tag-small">紧急</span>`;
                            }
                        }
                    },
                    {
                        title: '类型',
                        templet: function(d){
                            return  `<span class="yaya-tag yaya-tag-light-success tag-small">${d.sysNoticeType.noticeTypeName}</span>`;
                        }
                    },
                    {
                        title: '置顶',
                        templet: function(d){
                            return d.isTop==0?`<span class="yaya-tag yaya-tag-light-primary tag-small">否</span>`:`<span class="yaya-tag yaya-tag-light-primary tag-small">是</span>`;
                        }
                    },
                    {
                        field:'createTime',
                        title: '创建时间'
                    },
                    {
                        field:'updateTime',
                        title: '更新时间'
                    },
                    {
                        title: '操作',
                        width:230,
                        fixed: 'right',
                        templet: '#ID-notice-unit-tpl'
                    }
                ]]
            });
        })
    </script>
</body>
</html>
