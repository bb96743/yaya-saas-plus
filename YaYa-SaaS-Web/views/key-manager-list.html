<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../layui/css/layui.css">
    <link rel="stylesheet" href="../css/yaya-common.css">
    <link rel="stylesheet" href="../css/yaya-style-extend.css">
    <!-- 第三方图标库css -->
    <link rel="stylesheet" href="../font/iconfont.css">
    <title>yaya-admin-plus</title>
    <style>
        /* 分页页码显示 伪类 */
        .layui-laypage a:hover{
            color: #409eff;
        }
        /* 下拉框圆角 */
        .layui-form-select .layui-input{
            border-radius: 5px;
        }
        /* 弹出层圆角 */
        .layui-layer{
            border-radius: 10px;
        }
        /* 单选框颜色 */
        .layui-form-radio:hover>*, .layui-form-radioed, .layui-form-radioed>i{
            color: #409eff;
        }
        .layui-table-tool .layui-table-tool-temp{
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: flex-end;
            padding-right:unset;
        }
    </style>
</head>
<body>
    <div class="yaya-container">
        <div class="yaya-panel">
            <form class="layui-form" style="padding: 10px 0;">
                <div class="layui-row">
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <label class="yaya-form-label">部门</label>
                        <div class="yaya-input-block">
                            <input type="text" name="deptName" placeholder="部门名称" class="layui-input yaya-input-border-radius">
                        </div>
                    </div>
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <button type="button" class="yaya-btn yaya-primary" lay-submit lay-filter="search"><i class="iconfont icon-CRMEB-sousuo-xianxing" style="padding-right: 5px;"></i> 搜索</button>
                        <button type="reset" class="yaya-btn" style="margin-left: 10px;"><i class="iconfont icon-CRMEB-shuaxin1" style="padding-right: 5px;"></i> 重置</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="yaya-panel" style="margin-top: 15px;padding: 5px;">
            <!-- 表格显示 -->
            <table class="layui-hide" id="table-key" lay-filter="table-key"></table>
        </div>
    </div>
    <!-- 表格单元格:删除-更新-添加 权限控制 -->
    <script id="ID-key-unit-tpl" type="text/html">
        {{# if(is_super || hasPermission('key-del')){ }}
        <button class="yaya-btn is-link-primary yaya-btn-small" lay-event="del"><i style="font-size: 12px;margin-right: 2px;" class="iconfont icon-CRMEB-neirongzixun-xianxing"></i> 删除</button>
        {{# } }}
    </script>
    <!-- 顶部添加权限控制 -->
    <script id="ID-key-top-tpl" type="text/html">
        {{# if(is_super || hasPermission('key-add')){ }}
        <button lay-event="key-add"  type="button" class="yaya-btn yaya-primary"><i class="layui-icon layui-icon-add-1"></i> 添加</button>
        {{# } }}
    </script>
    <script src="../layui/layui.js"></script>
    <script src="../js/server.js"></script>
    <script>
        layui.use(function(){
            const $ = layui.$;
            const form = layui.form;
            const table = layui.table;
            const layer = layui.layer;
            const laytpl = layui.laytpl;

            
            //表格顶部工具栏事件
            table.on('toolbar(table-key)', function(obj){
                console.log(obj);
                switch(obj.event){
                    case 'key-add':
                        layer.open({
                            type: 2, // page 层类型 iframe
                            offset: '10px',
                            area: ['400px', '300px'],
                            title: '添加',
                            shade: 0.6, // 遮罩透明度
                            shadeClose: true, // 点击遮罩区域，关闭弹层
                            content: 'key-manager-add.html',
                            end: function(){
                                //刷新表格
                                table.reload('table-key');
                            }
                        });
                    break;    
                }
            });
            
            
            //搜索
            form.on('submit(search)', function(data){
                let field = data.field; // 获得表单字段
                // 执行搜索重载
                table.reload('table-key', {
                    page: {
                        curr: 1, // 重新从第 1 页开始
                        prev:'上一页',
                        next:'下一页',
                        limit:10,
                        limits:[10,20,30,40,50],
                        theme:'#409eff'
                    },
                    where: field // 搜索的字段
                });
                return false; // 阻止默认 form 跳转
            });


            //单元格事件
            table.on('tool(table-key)', function(obj){
                console.log(obj);
                //事件
                let event = obj.event;
                if(event==='del'){ //删除事件
                    layer.confirm('确定删除吗？', function(index){
                        layer.close(index);//关闭弹窗
                        // 向后端发送删除请求，执行完毕后，可通过 reloadData 方法完成数据重载
                        let keyId = obj.data.keyId;
                        $.ajax({
                            url: server_url+'/deleteKeyManagement',
                            type:'POST',
                            dataType:'json',
                            headers:{
                                'Authorization': token
                            },
                            data:{keyId:keyId},
                            success: function(resp){
                                if(resp.code===0){
                                    //刷新
                                    table.reload('table-key');
                                }else{
                                    layer.msg(resp.msg)
                                }
                            }
                        });
                    });
                }
            })

            //表格渲染
            table.render({
                elem: '#table-key',
                url: server_url+'/getKeyManagementPage',
                method:'POST',
                headers:{
                    'Authorization':token
                },
                skin:'line',
                height:'full',
                toolbar:'#ID-key-top-tpl',
                defaultToolbar:[],
                parseData: function(res){
                    return {
                        "code" : res.code,
                        "msg"  : res.msg,
                        "data" : res.data.records,
                        "count": res.data.total
                    }
                },
                page:{
                    prev:'上一页',
                    next:'下一页',
                    limit:10,
                    limits:[10,20,30,40,50],
                    theme:'#409eff'
                },
                request: {
                    pageName: 'pageNo', // 页码的参数名称，默认：page
                    limitName: 'pageSize' // 每页数据条数的参数名，默认：limit
                },
                cols: [[
                    {
                        title: '#',
                        type: 'numbers'
                    },
                    {
                        field:'deptName',
                        title: '部门'
                    },
                    {
                        field:'publicKeyContent',
                        title:'公钥'
                    },
                    {
                        field:'privateKeyContent',
                        title: '私钥'
                    },
                    {
                        field:'createName',
                        title: '创建人'
                    },
                    {
                        field:'createTime',
                        title: '上传时间'
                    },
                    {
                        title: '操作',
                        width: 100,
                        fixed: 'right',
                        templet:'#ID-key-unit-tpl'
                    }
                ]]
            })

        });
    </script>
</body>
</html>
