<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../layui/css/layui.css">
    <link rel="stylesheet" href="../css/yaya-common.css">
    <link rel="stylesheet" href="../css/yaya-style-extend.css">
    <!-- 第三方图标库css -->
    <link rel="stylesheet" href="../font/iconfont.css">
    <title>yaya-admin-plus</title>
    <style>    
        /* 状态看板卡片样式 */
        .cards-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { flex: 1; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); border: 1px solid #ebeef5; }
        .card-title { font-size: 14px; color: #909399; margin-bottom: 10px; }
        .card-value { font-size: 28px; font-weight: bold; color: #409EFF; margin: 0; }
        
        /* 操作面板样式 */
        .panel { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); border: 1px solid #ebeef5; }
        .panel-title { font-size: 18px; margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-item { display: flex; align-items: center; margin-bottom: 20px; }
        .form-item label { width: 120px; font-size: 14px; color: #606266; }
        .form-item input { flex: 1; max-width: 400px; height: 36px; padding: 0 15px; border: 1px solid #dcdfe6; border-radius: 4px; outline: none; margin-right: 15px; font-size: 14px; }
        .form-item input:focus { border-color: #409EFF; }
        
        /* 按钮样式 */
        .btn { height: 38px; padding: 0 20px; border: none; border-radius: 4px; color: #fff; font-size: 14px; cursor: pointer; transition: background 0.3s; }
        .btn-danger { background-color: #f56c6c; }
        .btn-danger:hover { background-color: #e64242; }
        .btn-warning { background-color: #e6a23c; }
        .btn-warning:hover { background-color: #d8932c; }
    </style>
</head>
<body>
    <div class="yaya-container">
        <div class="yaya-panel" style="padding-top: 10px;border-radius: 10px;">
            <div class="cards-container">
                <div class="card">
                    <div class="card-title">CPU核数</div>
                    <div class="card-value" id="cupCount">12核</div>
                </div>
                <div class="card">
                    <div class="card-title">系统内存</div>
                    <div class="card-value" id="sysMemory">1024M</div>
                </div>
                <div class="card">
                    <div class="card-title">Key 总数</div>
                    <div class="card-value" id="keyCount">0</div>
                </div>
                <div class="card">
                    <div class="card-title">内存占用</div>
                    <div class="card-value" id="usedMemory">0B</div>
                </div>
                <div class="card">
                    <div class="card-title">客户端连接数</div>
                    <div class="card-value" id="connectedClients">0</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">缓存清理（危险操作,虽然提供了删除入口,但是操作要慎重）</div>
                <div class="form-item">
                    <label>指定 Key 删除</label>
                    <input type="text" id="targetKey" placeholder="请输入完整的 Key，例如 user:info:1">
                    <button class="btn btn-danger" id="btnDeleteKey">精确删除</button>
                </div>

                <div class="form-item">
                    <label>按前缀批量删除</label>
                    <input type="text" id="targetPrefix" placeholder="请输入 Key 前缀，例如 user:session:">
                    <button class="btn btn-warning" id="btnDeletePrefix">批量删除</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../layui/layui.js"></script>
    <script src="../js/server.js"></script>
    <script>
        layui.use(function(){
            const $ = layui.$;
            const form = layui.form;
            const table = layui.table;
            const layer = layui.layer;

            //指定前缀删除
            $("#btnDeletePrefix").click(function(){
                //删除的key
                let search = $("#targetPrefix").val();
                if(search && search.length>0){
                    layer.confirm('确定删除吗？', function(index){
                        layer.close(index);//关闭弹窗
                        // 向后端发送删除请求，执行完毕后，可通过 reloadData 方法完成数据重载
                        
                        $.ajax({
                            url: server_url+'/deleteByPrefix',
                            type:'POST',
                            data:{prefix:search},
                            dataType:'json',
                            headers:{
                                'Authorization': token
                            },
                            success: function(resp){
                                if(resp.code===0){
                                    layer.msg("删除成功");
                                }else{
                                    layer.msg(resp.msg)
                                }
                            }
                        });
                    });
                }else{
                    layer.msg("请输入key");
                }
                
            });

            //精确删除key
            $("#btnDeleteKey").click(function(){
                //删除的key
                let search = $("#targetKey").val();
                if(search && search.length>0){
                    layer.confirm('确定删除吗？', function(index){
                        layer.close(index);//关闭弹窗
                        // 向后端发送删除请求，执行完毕后，可通过 reloadData 方法完成数据重载
                        
                        $.ajax({
                            url: server_url+'/deleteKey',
                            type:'POST',
                            data:{key:search},
                            dataType:'json',
                            headers:{
                                'Authorization': token
                            },
                            success: function(resp){
                                if(resp.code===0){
                                    layer.msg("删除成功");
                                }else{
                                    layer.msg(resp.msg)
                                }
                            }
                        });
                    });
                }else{
                    layer.msg("请输入key");
                }
                
            });

            //redis的基本信息
            $.ajax({
                type:'POST',
                url: server_url+'/getRedisSysInfo',
                headers:{
                    'Authorization': token
                },
                dataType:'json',
                success:function(resp){
                    console.log(resp)
                    if(resp.code===0){
                        let redis = resp.data;
                        $("#cupCount").html(redis.cpu_num+"核");//虚拟CPU核数
                        $("#sysMemory").html(redis.total_memory);//总内存数
                        $("#keyCount").html(redis.key_count);//key数量
                        $("#usedMemory").html(redis.used_memory);//内存使用
                        $("#connectedClients").html(redis.connected_clients);//客户端连接数
                    }else{
                        layer.msg(resp.msg);
                    }
                }
            });


        });
    </script>
</body>
</html>
